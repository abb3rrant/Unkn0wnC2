services:
  archon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: archon
    entrypoint: ["/scripts/archon-entrypoint.sh"]
    ports:
      - "8443:8443"
    volumes:
      - builds:/opt/unkn0wnc2/builds
      - archon-data:/opt/unkn0wnc2/data
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6}
      - JWT_SECRET=${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TestAdmin2026!}
    networks:
      c2net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-ks", "https://localhost:8443/login"]
      interval: 5s
      timeout: 3s
      retries: 10

  dns1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dns1
    entrypoint: ["/scripts/dns-entrypoint.sh"]
    environment:
      - SERVER_BINARY=dns-server-1
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      c2net:
        ipv4_address: 172.20.0.11

  dns2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dns2
    entrypoint: ["/scripts/dns-entrypoint.sh"]
    environment:
      - SERVER_BINARY=dns-server-2
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      c2net:
        ipv4_address: 172.20.0.12

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: client
    entrypoint: ["/scripts/client-entrypoint.sh"]
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns1:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.20

  setup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: setup
    entrypoint: ["/scripts/setup.sh"]
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TestAdmin2026!}
      - ARCHON_URL=https://172.20.0.10:8443
    volumes:
      - builds:/opt/unkn0wnc2/builds
    depends_on:
      archon:
        condition: service_healthy
    networks:
      c2net:
        ipv4_address: 172.20.0.100

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: test-runner
    entrypoint: ["/scripts/run-tests.sh"]
    environment:
      - ARCHON_URL=https://172.20.0.10:8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TestAdmin2026!}
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns1:
        condition: service_started
      dns2:
        condition: service_started
      client:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.200
    profiles:
      - test

  extended-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: extended-test-runner
    entrypoint: ["/scripts/run-extended-tests.sh"]
    environment:
      - ARCHON_URL=https://172.20.0.10:8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TestAdmin2026!}
    volumes:
      - builds:/opt/unkn0wnc2/builds
    depends_on:
      dns1:
        condition: service_started
      dns2:
        condition: service_started
      client:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.201
    profiles:
      - extended-test

volumes:
  builds:
  archon-data:

networks:
  c2net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
