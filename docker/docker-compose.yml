services:
  archon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: archon
    entrypoint: ["/scripts/archon-entrypoint.sh"]
    ports:
      # Loopback by default. A control plane on 0.0.0.0 is reachable from the
      # internet the moment the host has a public interface; set
      # ARCHON_BIND_ADDR=<ip> to publish it deliberately.
      - "${ARCHON_BIND_ADDR:-127.0.0.1}:8443:8443"
    volumes:
      - builds:/opt/unkn0wnc2/builds
      - archon-data:/opt/unkn0wnc2/data
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    networks:
      c2net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-ks", "https://localhost:8443/login"]
      interval: 5s
      timeout: 3s
      retries: 10

  dns1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dns1
    entrypoint: ["/scripts/dns-entrypoint.sh"]
    environment:
      - SERVER_BINARY=dns-server-1
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
      # Setup opts the generated profile into the E2E topology while retaining
      # its per-build SPKI pin and authoritative custom-header template.
      - http-profiles:/opt/unkn0wnc2/profiles
    ports:
      # HTTP/HTTPS listener. The host port avoids archon's own 8443; the container
      # port must match an enabled profile's bind_port.
      - "${LISTENER_BIND_ADDR:-0.0.0.0}:8445:8443"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      setup:
        condition: service_completed_successfully
        # A one-shot producer, not a runtime dependency: `up dns1` on a live
        # deployment must not re-run setup (and with the idempotency gate in
        # setup.sh it would be a no-op anyway).
        required: false
    networks:
      c2net:
        ipv4_address: 172.20.0.11

  dns2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dns2
    entrypoint: ["/scripts/dns-entrypoint.sh"]
    environment:
      - SERVER_BINARY=dns-server-2
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
      - http-profiles:/opt/unkn0wnc2/profiles
    ports:
      # Offset on the host so both DNS servers, and archon, can each publish one.
      - "${LISTENER_BIND_ADDR:-0.0.0.0}:8446:8443"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      setup:
        condition: service_completed_successfully
        # A one-shot producer, not a runtime dependency: `up dns1` on a live
        # deployment must not re-run setup (and with the idempotency gate in
        # setup.sh it would be a no-op anyway).
        required: false
    networks:
      c2net:
        ipv4_address: 172.20.0.12

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: client
    entrypoint: ["/scripts/client-entrypoint.sh"]
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns1:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.20

  http-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: http-client
    entrypoint: ["/scripts/client-entrypoint.sh"]
    environment:
      - CLIENT_BINARY=/opt/unkn0wnc2/builds/beacon-http
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns1:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.21

  # Plain-HTTP beacon built from the profile Archon seeds by default. It reaches
  # dns2 on 8444, which is the default profile's bind port offset for this stack.
  http-client-default:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: http-client-default
    entrypoint: ["/scripts/client-entrypoint.sh"]
    environment:
      - CLIENT_BINARY=/opt/unkn0wnc2/builds/beacon-default
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns2:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.22

  setup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: setup
    entrypoint: ["/scripts/setup.sh"]
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ARCHON_URL=https://172.20.0.10:8443
    volumes:
      - builds:/opt/unkn0wnc2/builds
      - http-profiles:/opt/unkn0wnc2/profiles
    depends_on:
      archon:
        condition: service_healthy
    networks:
      c2net:
        ipv4_address: 172.20.0.100

  http-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: http-test-runner
    entrypoint: ["/scripts/run-http-transport-tests.sh"]
    environment:
      - ARCHON_URL=https://172.20.0.10:8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - LISTENER_URL=https://172.20.0.11:8443
      - DEFAULT_LISTENER_URL=http://172.20.0.12:8444
    depends_on:
      dns1:
        condition: service_started
      http-client:
        condition: service_started
      http-client-default:
        condition: service_started
    volumes:
      # The transport-push check projects a listener spec from the profile the
      # listener is actually serving, so it cannot invent an unreachable one.
      - http-profiles:/opt/unkn0wnc2/profiles:ro
    networks:
      c2net:
        ipv4_address: 172.20.0.202
    profiles:
      - http-test

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: test-runner
    entrypoint: ["/scripts/run-tests.sh"]
    environment:
      - ARCHON_URL=https://172.20.0.10:8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - builds:/opt/unkn0wnc2/builds:ro
    depends_on:
      dns1:
        condition: service_started
      dns2:
        condition: service_started
      client:
        condition: service_started
      http-client:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.200
    profiles:
      - test

  extended-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: extended-test-runner
    entrypoint: ["/scripts/run-extended-tests.sh"]
    environment:
      - ARCHON_URL=https://172.20.0.10:8443
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - builds:/opt/unkn0wnc2/builds
    depends_on:
      dns1:
        condition: service_started
      dns2:
        condition: service_started
      client:
        condition: service_started
      http-client:
        condition: service_started
    networks:
      c2net:
        ipv4_address: 172.20.0.201
    profiles:
      - extended-test

volumes:
  builds:
  archon-data:
  http-profiles:

networks:
  c2net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
