<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <title>Stager Sessions - Unkn0wnC2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=ITC+Benguiat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .section-title {
            font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: rgba(255, 51, 51, 0.8);
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.15);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(10, 10, 10, 0.98);
            border: 1px solid rgba(255, 51, 51, 0.15);
            border-top: 2px solid rgba(255, 51, 51, 0.3);
            border-radius: 0;
            padding: 25px;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            position: relative;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 15px;
            height: 15px;
            background: linear-gradient(135deg, transparent 50%, rgba(255, 51, 51, 0.3) 50%);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-top-color: rgba(255, 51, 51, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 -2px 0 rgba(255, 51, 51, 0.2) inset;
        }

        .stat-label {
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            color: rgba(255, 51, 51, 0.8);
            font-size: 36px;
            font-weight: 700;
        }

        .sessions-table {
            background: rgba(10, 10, 10, 0.98);
            border: 1px solid rgba(255, 51, 51, 0.15);
            border-left: 3px solid rgba(255, 51, 51, 0.3);
            border-radius: 0;
            padding: 25px;
            overflow-x: auto;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            position: relative;
        }

        .sessions-table::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, transparent 50%, rgba(255, 51, 51, 0.3) 50%);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid rgba(255, 51, 51, 0.15);
            color: rgba(255, 51, 51, 0.8);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        tr:hover {
            background: rgba(255, 51, 51, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            padding-left: 16px;
            border-radius: 0;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
        }

        .status-active {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            border-left: 3px solid #ffa500;
        }

        .status-completed {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border-left: 3px solid #00ff00;
        }

        .status-failed {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            border: 1px solid rgba(255, 0, 0, 0.4);
        }

        .progress-bar {
            width: 250px;
            height: 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 51, 51, 0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ff6666);
            transition: width 0.3s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #444;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background: rgba(255, 51, 51, 0.08);
            border: 1px solid #ff3333;
            color: rgba(255, 51, 51, 0.8);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(255, 51, 51, 0.15);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auto-refresh label {
            color: #555;
            font-size: 13px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: rgba(255, 51, 51, 0.15);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
        }

        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .fail-btn {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6666;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        .fail-btn:hover {
            background: rgba(255, 100, 100, 0.4);
        }

        .delete-btn {
            background: rgba(255, 50, 50, 0.2);
            color: #ff4444;
            border: 1px solid rgba(255, 50, 50, 0.3);
        }

        .delete-btn:hover {
            background: rgba(255, 50, 50, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Unkn0wnC2</div>
        <div class="navbar-right">
            <div class="ws-status" id="wsStatus">
                <div class="ws-status-dot"></div>
                <span class="ws-status-text">Connecting...</span>
            </div>
            <div class="user-info">Logged in as <strong id="username">admin</strong></div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="nav-menu">
        <a href="/dashboard" class="nav-btn">Dashboard</a>
        <a href="/builder" class="nav-btn">Builder</a>
        <a href="/stager" class="nav-btn active">Stager Sessions</a>
        <a href="/exfils" class="nav-btn">Exfils</a>
        <a href="/logs" class="nav-btn">Logs</a>
        <a href="/report" class="nav-btn">Report</a>
        <a href="/users" class="nav-btn" id="usersNavBtn">Users</a>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 class="section-title">Stager Sessions</h1>
            <div class="auto-refresh">
                <label>Auto-refresh:</label>
                <div class="toggle-switch" id="autoRefreshToggle" onclick="toggleAutoRefresh()">
                    <div class="toggle-slider"></div>
                </div>
                <button class="refresh-btn" onclick="loadStagerSessions()">Refresh Now</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Sessions</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="statActive">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="statCompleted">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Speed</div>
                <div class="stat-value" id="statAvgSpeed">N/A</div>
            </div>
        </div>

        <!-- Sessions Table -->
        <div class="sessions-table">
            <table>
                <thead>
                    <tr>
                        <th>Session ID</th>
                        <th>Stager IP</th>
                        <th>OS/Arch</th>
                        <th>Progress</th>
                        <th>Status</th>
                        <th>Speed</th>
                        <th>ETA</th>
                        <th>DNS Server</th>
                        <th>Started</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="sessionsTableBody">
                    <tr>
                        <td colspan="10" class="empty-state">
                            <div class="empty-state-icon">⏳</div>
                            <div>Loading stager sessions...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/shared.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let autoRefreshInterval = null;
        let autoRefreshEnabled = false;
        let autoRefreshFailCount = 0;

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const toggle = document.getElementById('autoRefreshToggle');
            
            if (autoRefreshEnabled) {
                toggle.classList.add('active');
                if (autoRefreshInterval) clearInterval(autoRefreshInterval);
                autoRefreshFailCount = 0;
                autoRefreshInterval = setInterval(async () => {
                    try {
                        await loadStagerSessions();
                        autoRefreshFailCount = 0;
                    } catch (err) {
                        autoRefreshFailCount++;
                        console.error('[Stager] Auto-refresh error:', err);
                        if (autoRefreshFailCount >= 3) {
                            clearInterval(autoRefreshInterval);
                            autoRefreshInterval = null;
                            autoRefreshEnabled = false;
                            toggle.classList.remove('active');
                            showToast('Auto-refresh stopped after 3 consecutive failures', 'error');
                        }
                    }
                }, 3000);
                console.log('[Stager] Auto-refresh enabled');
            } else {
                toggle.classList.remove('active');
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                console.log('[Stager] Auto-refresh disabled');
            }
        }

        async function loadStagerSessions() {
            try {
                const response = await authFetch('/api/stager/sessions');
                if (!response) {
                    console.error('[Stager] No response from authFetch');
                    return;
                }

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('[Stager] API error:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const raw = await response.json();
                const sessions = Array.isArray(raw) ? raw : [];
                
                // Update stats - use same completion logic as table display
                const total = sessions.length;
                const isSessionComplete = (s) => s.completed || (s.total_chunks > 0 && s.chunks_delivered >= s.total_chunks);
                const active = sessions.filter(s => !isSessionComplete(s)).length;
                const completed = sessions.filter(s => isSessionComplete(s)).length;
                
                // Calculate average speed from completed sessions
                let avgSpeed = 0;
                const completedSessions = sessions.filter(s => isSessionComplete(s) && s.completed_at);
                if (completedSessions.length > 0) {
                    const totalSpeed = completedSessions.reduce((sum, s) => {
                        const duration = s.completed_at - s.created_at;
                        const speed = duration > 0 ? s.total_chunks / duration : 0;
                        return sum + speed;
                    }, 0);
                    avgSpeed = (totalSpeed / completedSessions.length).toFixed(1);
                }

                const statTotal = document.getElementById('statTotal');
                const statActive = document.getElementById('statActive');
                const statCompleted = document.getElementById('statCompleted');
                const statAvgSpeed = document.getElementById('statAvgSpeed');
                
                if (statTotal) statTotal.textContent = total;
                if (statActive) statActive.textContent = active;
                if (statCompleted) statCompleted.textContent = completed;
                if (statAvgSpeed) statAvgSpeed.textContent = avgSpeed > 0 ? avgSpeed + ' ch/s' : 'N/A';

                // Update table
                const tbody = document.getElementById('sessionsTableBody');
                
                if (sessions.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="10" class="empty-state">
                                <div class="empty-state-icon">${icons.listDashes}</div>
                                <div>No stager sessions yet</div>
                                <div style="margin-top: 10px; color: #444; font-size: 12px;">
                                    Deploy a stager to see sessions here
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = sessions.map(session => {
                    const progress = session.total_chunks > 0
                        ? Math.round((session.chunks_delivered / session.total_chunks) * 100)
                        : 0;

                    // Mark as completed if backend says so OR if all chunks delivered
                    const isComplete = session.completed || (session.total_chunks > 0 && session.chunks_delivered >= session.total_chunks);

                    const status = isComplete
                        ? 'completed'
                        : (session.chunks_delivered > 0 ? 'active' : 'pending');

                    const statusClass = isComplete
                        ? 'status-completed'
                        : 'status-active';

                    const started = new Date(session.created_at * 1000).toLocaleString();

                    // Calculate speed and ETA - created_at is Unix seconds
                    const elapsedSeconds = session.completed_at
                        ? (session.completed_at - session.created_at)
                        : (Date.now() / 1000 - session.created_at);

                    const chunksPerSecond = elapsedSeconds > 0
                        ? (session.chunks_delivered / elapsedSeconds)
                        : 0;

                    const speed = chunksPerSecond > 0
                        ? `${chunksPerSecond.toFixed(1)} ch/s`
                        : 'N/A';

                    let eta = 'N/A';
                    if (!isComplete && chunksPerSecond > 0 && session.chunks_delivered > 0) {
                        const remainingChunks = session.total_chunks - session.chunks_delivered;
                        const etaSeconds = Math.round(remainingChunks / chunksPerSecond);
                        eta = formatDuration(etaSeconds * 1000);
                    } else if (isComplete) {
                        eta = 'Done';
                    }

                    const escapedId = escapeHtml(session.id || '');
                    const escapedIp = escapeHtml(session.stager_ip || 'Unknown');
                    const escapedOs = escapeHtml(session.os || 'Unknown');
                    const escapedArch = escapeHtml(session.arch || 'Unknown');
                    const escapedDns = escapeHtml(session.initiated_by_dns || 'N/A');

                    return `
                        <tr>
                            <td><code style="color: rgba(255, 51, 51, 0.8);">${escapedId}</code></td>
                            <td>${escapedIp}</td>
                            <td>${escapedOs}/${escapedArch}</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress}%"></div>
                                    <div class="progress-text">${session.chunks_delivered}/${session.total_chunks} (${progress}%)</div>
                                </div>
                            </td>
                            <td><span class="status-badge ${statusClass}">${escapeHtml(status)}</span></td>
                            <td style="color: ${chunksPerSecond > 0 ? '#00ff00' : '#666'};">${escapeHtml(speed)}</td>
                            <td style="color: ${isComplete ? '#00ff00' : '#ffa500'};">${escapeHtml(eta)}</td>
                            <td>${escapedDns}</td>
                            <td style="font-size: 11px;">${escapeHtml(started)}</td>
                            <td>
                                <div style="display: flex; gap: 5px;">
                                    ${!isComplete ? `<button class="action-btn fail-btn" data-action="fail" data-session="${escapedId}" title="Mark as Failed">${icons.xCircle} Fail</button>` : ''}
                                    <button class="action-btn delete-btn" data-action="delete" data-session="${escapedId}" title="Delete">${icons.trash} Delete</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Failed to load stager sessions:', error);
                const tbody = document.getElementById('sessionsTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="empty-state">
                            <div class="empty-state-icon">${icons.warning}</div>
                            <div>Failed to load stager sessions</div>
                            <div style="margin-top: 10px; color: #ff6666; font-size: 12px;">
                                ${escapeHtml(error.message)}
                            </div>
                        </td>
                    </tr>
                `;
                throw error; // Re-throw so auto-refresh can track failures
            }
        }

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes % 60}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            } else {
                return `${seconds}s`;
            }
        }

        async function markStagerFailed(sessionId) {
            if (!confirm('Mark this stager session as failed?')) return;
            
            try {
                const response = await authFetch(`/api/stager/sessions/${sessionId}/status`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: 'failed' })
                });
                
                if (response && response.ok) {
                    loadStagerSessions();
                } else {
                    alert('Failed to update session status');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update session status');
            }
        }

        async function deleteStagerSession(sessionId) {
            if (!confirm('Delete this stager session? This cannot be undone.')) return;
            
            try {
                const response = await authFetch(`/api/stager/sessions/${sessionId}`, {
                    method: 'DELETE'
                });
                
                if (response && response.ok) {
                    loadStagerSessions();
                } else {
                    alert('Failed to delete session');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete session');
            }
        }

        // Event delegation for table actions
        document.getElementById('sessionsTableBody').addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            const sessionId = btn.dataset.session;
            if (action === 'fail') {
                markStagerFailed(sessionId);
            } else if (action === 'delete') {
                deleteStagerSession(sessionId);
            }
        });

        // Initialize
        loadStagerSessions();
    </script>
</body>
</html>
